<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login - CORE RAMPAGE</title>
  <link rel="stylesheet" href="seller-style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand"><div class="seller-logo">CR</div><div><h1>Seller Center</h1><p>Masuk ke dashboard toko Anda</p></div></div>
      <form class="seller-form">
        <label>Email / Username</label>
        <input type="text" placeholder="seller@email.com">
        <label>Password</label>
        <input type="password" placeholder="Masukkan password">
        <button type="button">Masuk Seller</button>
      </form>
      <p class="auth-link">Belum punya toko? <a href="seller-register.html">Buka Toko Sekarang</a></p>
      <a class="back-home" href="../index.html">← Kembali ke Marketplace</a>
    </section>
  </main>
</body>
</html>
