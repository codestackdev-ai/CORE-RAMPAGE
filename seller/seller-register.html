<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buka Toko - CORE RAMPAGE</title>
  <link rel="stylesheet" href="seller-style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card wide">
      <div class="auth-brand"><div class="seller-logo">CR</div><div><h1>Buka Toko</h1><p>Buat toko Anda dan mulai berjualan</p></div></div>
      <form class="seller-form grid">
        <label>Nama Toko</label>
        <input type="text" placeholder="Nama toko Anda">
        <label>Username Toko (slug)</label>
        <input type="text" placeholder="contoh: toko-anda">
        <label>Nomor WhatsApp</label>
        <input type="text" placeholder="08xxxx">
        <label>Deskripsi Toko</label>
        <textarea placeholder="Deskripsikan toko Anda"></textarea>
        <label>Upload Logo</label>
        <input type="file">
        <label>Upload Cover</label>
        <input type="file">
        <button type="button">Buat Toko</button>
      </form>
      <a class="back-home" href="../index.html">← Kembali</a>
    </section>
  </main>
</body>
</html>
